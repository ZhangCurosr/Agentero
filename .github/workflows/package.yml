name: Package Desktop App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform"
        required: true
        default: "windows"
        type: choice
        options:
          - windows
          - macos
          - linux
          - all
      create_release:
        description: "Create draft GitHub Release with assets"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Remove conflicting Git link.exe
        shell: pwsh
        run: |
          $gitLinks = @(
            "C:\Program Files\Git\usr\bin\link.exe",
            "C:\Program Files\Git\bin\link.exe"
          )
          foreach ($link in $gitLinks) {
            if (Test-Path $link) {
              Write-Host "Removing conflicting linker: $link"
              Remove-Item -Path $link -Force -ErrorAction SilentlyContinue
            }
          }
          $activeLink = (Get-Command link.exe -ErrorAction SilentlyContinue)?.Source
          Write-Host "Active MSVC linker: $activeLink"
          if ($activeLink) {
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$activeLink" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage bundled ACP adapters
        run: node scripts/prepare-adapters.mjs

      - name: Stage PDFium
        run: node scripts/prepare-pdfium.mjs

      - name: Disable updater signing requirement
        run: |
          node -e "const fs = require('fs'); const file = 'src-tauri/tauri.conf.json'; const conf = JSON.parse(fs.readFileSync(file)); if (conf.bundle) { conf.bundle.createUpdaterArtifacts = false; } fs.writeFileSync(file, JSON.stringify(conf, null, 2));"

      - name: Build Tauri App (Windows)
        shell: pwsh
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          Remove-Item -Path "C:\Program Files\Git\usr\bin\link.exe" -Force -ErrorAction SilentlyContinue
          pnpm tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Agentero-Windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish Windows Release Assets
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('build-{0}', github.sha) }}
          name: Agentero ${{ github.ref_name || format('build-{0}', github.sha) }}
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build (macOS)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage bundled ACP adapters
        run: node scripts/prepare-adapters.mjs

      - name: Stage PDFium
        run: node scripts/prepare-pdfium.mjs

      - name: Disable updater signing requirement
        run: |
          node -e "const fs = require('fs'); const file = 'src-tauri/tauri.conf.json'; const conf = JSON.parse(fs.readFileSync(file)); if (conf.bundle) { conf.bundle.createUpdaterArtifacts = false; } fs.writeFileSync(file, JSON.stringify(conf, null, 2));"

      - name: Build Tauri App (macOS)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm tauri build

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Agentero-macOS
          path: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish macOS Release Assets
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('build-{0}', github.sha) }}
          name: Agentero ${{ github.ref_name || format('build-{0}', github.sha) }}
          draft: true
          files: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build (Linux)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage bundled ACP adapters
        run: node scripts/prepare-adapters.mjs

      - name: Stage PDFium
        run: node scripts/prepare-pdfium.mjs

      - name: Disable updater signing requirement
        run: |
          node -e "const fs = require('fs'); const file = 'src-tauri/tauri.conf.json'; const conf = JSON.parse(fs.readFileSync(file)); if (conf.bundle) { conf.bundle.createUpdaterArtifacts = false; } fs.writeFileSync(file, JSON.stringify(conf, null, 2));"

      - name: Build Tauri App (Linux)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm tauri build

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Agentero-Linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Publish Linux Release Assets
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('build-{0}', github.sha) }}
          name: Agentero ${{ github.ref_name || format('build-{0}', github.sha) }}
          draft: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
